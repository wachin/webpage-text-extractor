<?xml version="1.0" encoding="UTF-8"?>
<!-- 
  Program icon: Webpage Text Extractor
  A browser window whose text lines flow into a single .txt report.

  Plain SVG 1.1: only shapes, gradients and opacity.
  No filters or raster effects, so the file opens and stays fully
  editable in Inkscape (and any other vector editor).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256" viewBox="0 0 256 256" version="1.1">
  <title>Webpage Text Extractor</title>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A97FF"/>
      <stop offset="1" stop-color="#1B54B8"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F6FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <g id="background-layer">
    <rect id="background-rect" x="0" y="0" width="256" height="256"
          rx="56" ry="56" fill="url(#background)"/>
    <rect id="inner-border" x="5" y="5" width="246" height="246"
          rx="52" ry="52" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.18" stroke-width="3"/>
  </g>

  <!-- Browser window with the text of the saved web page -->
  <g id="browser-window">
    <rect id="window" x="44" y="28" width="168" height="112" rx="16" ry="16"
          fill="url(#page)" stroke="#0E3E8F" stroke-opacity="0.30"
          stroke-width="2"/>
    <path id="title-bar" d="M 44 44 Q 44 28 60 28 H 196 Q 212 28 212 44 V 56 H 44 Z"
          fill="#DCE9FC"/>
    <circle id="dot-close" cx="62" cy="42" r="4.5" fill="#FF5F57"/>
    <circle id="dot-minimize" cx="80" cy="42" r="4.5" fill="#FEBC2E"/>
    <circle id="dot-maximize" cx="98" cy="42" r="4.5" fill="#28C840"/>
    <rect id="address-bar" x="112" y="37" width="88" height="10" rx="5" ry="5"
          fill="#FFFFFF" fill-opacity="0.9"/>
    <rect id="line-1" x="60" y="70" width="120" height="10" rx="5" ry="5"
          fill="#8FB4EE"/>
    <rect id="line-2" x="60" y="90" width="136" height="10" rx="5" ry="5"
          fill="#C1D4F2"/>
    <rect id="line-3" x="60" y="110" width="72" height="10" rx="5" ry="5"
          fill="#C1D4F2"/>
  </g>

  <!-- Extraction arrow -->
  <g id="arrow">
    <path id="arrow-shape" d="M 112 150 H 144 V 174 H 158 L 128 198 L 98 174 H 112 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- Single concatenated .txt report -->
  <g id="output-report">
    <rect id="report" x="48" y="206" width="160" height="24" rx="12" ry="12"
          fill="#FFFFFF"/>
    <rect id="report-line-1" x="64" y="214" width="84" height="8" rx="4" ry="4"
          fill="#8FB4EE"/>
    <rect id="report-line-2" x="156" y="214" width="36" height="8" rx="4" ry="4"
          fill="#C1D4F2"/>
  </g>
</svg>
